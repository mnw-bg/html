<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>Tilauslomake</title>
</head>
<body>

<h1>Lehden tilauslomake</h1>

<form>
  Etunimi: <input type="text" tabindex="1"><br><br>
  Sukunimi: <input type="text" tabindex="2"><br><br>
  Osoite: <input type="text" tabindex="3"><br><br>
  Postinumero: <input type="text" maxlength="5" size="5" tabindex="4"><br><br>
  Postitoimipaikka: <input type="text" tabindex="5"><br><br>
  Puhelinnumero: <input type="text" tabindex="6"><br><br>

  Tilausjakso:
  <input type="radio" name="jakso" value="3" tabindex="7"> 3 kk
  <input type="radio" name="jakso" value="6" tabindex="8"> 6 kk
  <input type="radio" name="jakso" value="12" tabindex="9"> 12 kk
  <br><br>

  <input type="submit" value="Lähetä tilaus" tabindex="10">
  <input type="reset" value="Tyhjennä lomake" tabindex="11">
</form>

</body>
</html>

<!DOCTYPE html>
<html lang="fi">
<head>
    <title>lomake</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container mt-4">
        <h1>Yhteydenottolomake</h1>
            <form>
                <div class="form-group">
                    <label for="name">Nimi:</label>
                    <input type="text" class="form-control" id="name" placeholder="Syötä nimesi">
                </div>
                <div class="form-group">
                    <label for="email">Sähköposti:</label>
                    <input type="email" class="form-control" id="email" placeholder="Syötä sähköpostiosoitteesi">
                </div>
                <div class="form-group">
                    <label for="phone">puhelinnumero:</label>
                    <input type="tel" class="form-control" id="phone" placeholder="Syötä puhelinnumero">
                </div>
                <div class="form-group">
                    <label for="message">Viesti:</label>
                    <textarea class="form-control" id="message" rows="5" placeholder="Kirjoita viestisi tähän"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Lähetä</button>

            </form>
    </div>
</body>
</html>
